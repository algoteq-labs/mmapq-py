[build-system]
requires = ["setuptools>=77.0.3", "cffi>=1.17.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mmapq"
dynamic = ["version"]
description = "Python bindings for mmapq — low-latency memory-mapped queue"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Anton Anufriev" },
]
readme = "README.md"
keywords = ["mmap", "shared-memory", "queue", "lock-free", "high-performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["cffi>=1.17.1"]

[project.urls]
Homepage = "https://github.com/algoteq-labs/mmapq"
Source = "https://github.com/algoteq-labs/mmapq-py"
BugTracker = "https://github.com/algoteq-labs/mmapq-py/issues"

[tool.setuptools.dynamic]
version = {attr = "mmapq._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
dev = ["pytest"]
