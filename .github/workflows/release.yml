name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout mmapq-py (committed gitlink, full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv python3-dev libffi-dev
      - name: Rewrite the version for a TestPyPI rehearsal (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          base=$(printf '%s' "$v" | sed -E 's/\.dev[0-9]+$//')
          sed -i -E "s/^(__version__ = \")[^\"]+(\")$/\1${base}.dev${RUN_ID}\2/" src/mmapq/_version.py
          cat src/mmapq/_version.py
        env:
          RUN_ID: ${{ github.run_id }}
      - name: Tag coherence checks
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          fail() { echo "tag-coherence: $1"; exit 1; }
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "not X.Y.Z: $V"
          PKG=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          [ "$PKG" = "$V" ] || fail "package $PKG != tag $V"
          HDR=$(sed -n 's/^#define MMAPQ_VERSION_STR "\(.*\)"$/\1/p' c/include/mmap_platform.h)
          [ "$HDR" = "$V" ] || fail "MMAPQ_VERSION_STR \"$HDR\" != tag $V"
          git -C c fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          TAGC=$(git -C c rev-parse "$TAG^{commit}")
          HEADC=$(git -C c rev-parse HEAD)
          [ "$TAGC" = "$HEADC" ] || fail "gitlink $HEADC is not the mmapq tag $TAG ($TAGC)"
          git merge-base --is-ancestor HEAD origin/main \
              || fail "wrapper commit is not on main"
          if [ "$(git -C c rev-parse --is-shallow-repository)" = "true" ]; then
              git -C c fetch --no-tags --unshallow origin
          fi
          git -C c fetch --no-tags origin main:refs/remotes/origin/main
          git -C c merge-base --is-ancestor HEAD origin/main \
              || fail "mmapq commit is not on main"
          echo "tag coherence OK: $TAG"
      - name: Resolve the package version
        id: version
        run: |
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the sdist
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/bv"
          "$RUNNER_TEMP/bv/bin/pip" install --upgrade pip build
          "$RUNNER_TEMP/bv/bin/python" -m build --sdist --outdir "$RUNNER_TEMP/dist" . 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -niE 'warning|deprecat' "$RUNNER_TEMP/build.log"; then echo "build printed warnings"; exit 1; fi
      - name: Check sdist contents and metadata
        run: python3 -I scripts/check_sdist.py "$RUNNER_TEMP"/dist/mmapq-*.tar.gz .
      - name: Install in a clean venv (latest build deps) and smoke-test
        shell: bash
        run: |
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          python3 -m venv "$RUNNER_TEMP/v1"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v1/bin/pip" install "$RUNNER_TEMP"/dist/mmapq-*.tar.gz
          "$RUNNER_TEMP/v1/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$v"
      - name: Install at the declared lower bounds and smoke-test
        shell: bash
        run: |
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          lo=$(python3 -I -c 'import tomllib; r=tomllib.load(open("pyproject.toml","rb"))["build-system"]["requires"]; print(" ".join(x.replace(">=","==") for x in r))')
          python3 -m venv "$RUNNER_TEMP/v2"
          "$RUNNER_TEMP/v2/bin/pip" install $lo
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v2/bin/pip" install --no-build-isolation "$RUNNER_TEMP"/dist/mmapq-*.tar.gz
          "$RUNNER_TEMP/v2/bin/pip" list | grep -iE '^(setuptools|cffi) '
          "$RUNNER_TEMP/v2/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$v"
      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: ${{ runner.temp }}/dist

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Publish guard
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "guard: not a v* tag: $GITHUB_REF"; exit 1;; esac
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "guard: not X.Y.Z: $V"; exit 1; }
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Check the sdist file name matches the tag
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist | sed -n 's/^mmapq-\(.*\)\.tar\.gz$/\1/p')
          [ -n "$PKG" ] || { echo "guard: no mmapq-<v>.tar.gz in dist: $(ls dist)"; exit 1; }
          [ "$PKG" = "$V" ] || { echo "guard: package $PKG != tag $V"; exit 1; }
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  registry-smoke:
    name: Smoke-test the published package
    needs: [build, testpypi, pypi]
    if: ${{ !cancelled() && (needs.testpypi.result == 'success' || needs.pypi.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout mmapq-py (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Python toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv python3-dev libffi-dev
      - name: Install from the registry and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          INDEX=()
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              INDEX=(--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/)
          fi
          python3 -m venv "$RUNNER_TEMP/v"
          for i in $(seq 1 10); do
              if "$RUNNER_TEMP/v/bin/pip" install --no-cache-dir ${INDEX[@]+"${INDEX[@]}"} "mmapq==${V}"; then
                  break
              fi
              if [ "$i" -eq 10 ]; then
                  echo "registry-smoke: mmapq==${V} not installable from the registry after 10 tries"
                  exit 1
              fi
              sleep 30
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$V"
