name: CI

on:
  push:
    branches:
      - main
      - 'ci-check/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python tests (committed gitlink)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Platform (ARM64 trial)
        run: |
          uname -m
          nproc
          lscpu | grep -E '^(Architecture|Vendor ID|Model name)' || true
          test "$(uname -m)" = aarch64
      - name: Checkout mmapq-py (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Install Python toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv python3-dev libffi-dev
      - name: CAND-55 hygiene wipe
        shell: bash
        run: |
          find c -name '*.o' -delete
          find c -name 'libmmapq.a' -delete
          rm -rf build
      - name: Build and run Python tests
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip cffi setuptools wheel
          "$RUNNER_TEMP/venv/bin/pip" install -e . --force-reinstall -q
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v
      - name: Binding coverage gate (every public binding method directly tested)
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          bash c/scripts/check_binding_coverage.sh --python .

  sdist:
    name: Package (sdist)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Platform (ARM64 trial)
        run: |
          uname -m
          nproc
          lscpu | grep -E '^(Architecture|Vendor ID|Model name)' || true
          test "$(uname -m)" = aarch64
      - name: Checkout mmapq-py (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Install Python toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv python3-dev libffi-dev
      - name: Build the sdist
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/bv"
          "$RUNNER_TEMP/bv/bin/pip" install --upgrade pip build
          "$RUNNER_TEMP/bv/bin/python" -m build --sdist --outdir "$RUNNER_TEMP/dist" . 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -niE 'warning|deprecat' "$RUNNER_TEMP/build.log"; then echo "build printed warnings"; exit 1; fi
      - name: Check sdist contents and metadata
        run: python3 -I scripts/check_sdist.py "$RUNNER_TEMP"/dist/mmapq-*.tar.gz .
      - name: Install in a clean venv (latest build deps) and smoke-test
        shell: bash
        run: |
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          python3 -m venv "$RUNNER_TEMP/v1"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v1/bin/pip" install "$RUNNER_TEMP"/dist/mmapq-*.tar.gz
          "$RUNNER_TEMP/v1/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$v"
      - name: Install at the declared lower bounds and smoke-test
        shell: bash
        run: |
          v=$(python3 -I -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/mmapq/_version.py").read()).group(1))')
          lo=$(python3 -I -c 'import tomllib; r=tomllib.load(open("pyproject.toml","rb"))["build-system"]["requires"]; print(" ".join(x.replace(">=","==") for x in r))')
          python3 -m venv "$RUNNER_TEMP/v2"
          "$RUNNER_TEMP/v2/bin/pip" install $lo
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v2/bin/pip" install --no-build-isolation "$RUNNER_TEMP"/dist/mmapq-*.tar.gz
          "$RUNNER_TEMP/v2/bin/pip" list | grep -iE '^(setuptools|cffi) '
          "$RUNNER_TEMP/v2/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$v"
